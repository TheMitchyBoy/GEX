name: Daily GEX Exports

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GEX exports for SPX
        env:
          TICKERS: SPX
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p data/exports img
          IFS=',' read -ra TS <<< "${TICKERS}"
          for t in "${TS[@]}"; do
            echo "Running main.py for $t"
            python main.py --ticker "$t" --no-show --no-save
          done

      - name: Commit and push exports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exports/*.csv data/exports/*.json img/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No export changes to commit"
          else
            git commit -m "chore: daily GEX exports [skip ci] $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
