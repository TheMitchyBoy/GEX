name: Publish Wiki

on:
  push:
    branches: [main]
    paths:
      - wiki/**
      - .github/workflows/publish-wiki.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push wiki to GitHub Wiki git repository
        env:
          WIKI_DIR: wiki
          WIKI_REPO: ${{ github.repository }}.wiki
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          cd "$workdir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r "$GITHUB_WORKSPACE/$WIKI_DIR"/. .
          git add -A
          git commit -m "docs: sync wiki from ${GITHUB_SHA}"
          git branch -M master
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${WIKI_REPO}.git"
          git push -f origin master
