name: Intraday GEX Exports

on:
  schedule:
    # Weekdays: every 2 minutes during approximate US cash session (UTC)
    - cron: "*/2 14-21 * * 1-5"
  workflow_dispatch:

jobs:
  run-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 2-minute GEX exports for SPX
        env:
          TICKERS: SPX
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          GEX_REFRESH_INTERVAL_MINUTES: "2"
          GEX_BACKFILL_INTERVAL_MINUTES: "2"
        run: |
          set -euo pipefail
          mkdir -p data/exports img
          python scripts/gex_refresh.py --tickers SPX --force

      - name: Retrain SPX overlay model
        env:
          GEX_TRAIN_LOOKBACK_DAYS: "90"
          GEX_TRAIN_MAX_CV_FOLDS: "120"
        run: |
          set -euo pipefail
          python scripts/train_gex_model.py --ticker SPX --lookback-days 90

      - name: Commit and push exports and model
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exports/*.csv data/exports/*.json models/SPX/manifest.json models/SPX_gex_delta_model.joblib 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No export or model changes to commit"
          else
            git commit -m "chore: intraday GEX exports and model retrain [skip ci] $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
