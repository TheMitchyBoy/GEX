<!doctype html>
<html lang="en" data-theme="{{ theme }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ ticker }} · GEX Widget</title>
    <style>
      :root {
        --bg: #07090f;
        --panel: rgba(10, 14, 24, 0.95);
        --border: rgba(255, 255, 255, 0.10);
        --text: #c9d1d9;
        --muted: #8b949e;
        --long: #00d97e;
        --short: #ff4757;
        --pad: 12px;
        --gap: 6px;
        --font-size: 14px;
        --label-size: 12px;
      }

      [data-theme="light"] {
        --bg: #f6f8fa;
        --panel: #ffffff;
        --border: rgba(27, 31, 36, 0.15);
        --text: #24292f;
        --muted: #57606a;
        --long: #1a7f37;
        --short: #cf222e;
      }

      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: var(--font-size);
      }

      .wrap {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: var(--pad);
        background: var(--panel);
      }

      .wrap.compact {
        --pad: 8px;
        --gap: 4px;
        --font-size: 12px;
        --label-size: 11px;
        border-radius: 8px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        margin-bottom: var(--gap);
      }

      .row:last-child {
        margin-bottom: 0;
      }

      .muted {
        color: var(--muted);
        font-size: var(--label-size);
      }

      .value {
        font-weight: 600;
      }

      .long {
        color: var(--long);
      }

      .short {
        color: var(--short);
      }
    </style>
  </head>
  <body>
    <div class="wrap{% if compact %} compact{% endif %}">
      <div class="row">
        <div class="value">{{ ticker }} · GEX</div>
        <div class="muted">{{ updated_at }}</div>
      </div>
      <div class="row">
        <div class="muted">Regime</div>
        <div class="value {{ 'long' if summary.regime and 'LONG' in summary.regime else 'short' }}">{{ summary.regime or 'N/A' }}</div>
      </div>
      <div class="row">
        <div class="muted">Total GEX</div>
        <div class="value">{{ '%+.3f'|format(summary.total_gex or 0) }} Bn$ / %</div>
      </div>
      <div class="row">
        <div class="muted">Gamma Flip</div>
        <div class="value">{{ '%.0f'|format(summary.gamma_flip) if summary.gamma_flip is not none else 'N/A' }}</div>
      </div>
      <div class="row">
        <div class="muted">Confluence</div>
        <div class="value">{{ '%.1f'|format(confluence.score or 0) }} / 100</div>
      </div>
    </div>
  </body>
</html>
