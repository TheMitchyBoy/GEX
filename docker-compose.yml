services:
  web:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
      - path: config/spx.env
        required: false
    environment:
      # Pass host UW_API_KEY only when set; do not default to blank (that blocks .env load).
      - UW_API_KEY
      - GEX_REFRESH_INTERVAL_MINUTES=10
      - GEX_DISABLE_SCHEDULER=0
    volumes:
      - ./data:/app/data
      - ./data/exports:/app/data/exports

  refresh:
    build: .
    command: python scripts/gex_refresh.py --force
    environment:
      - UW_API_KEY
    env_file:
      - path: .env
        required: false
      - path: config/spx.env
        required: false
    volumes:
      - ./data:/app/data
      - ./data/exports:/app/data/exports
    profiles:
      - tools
